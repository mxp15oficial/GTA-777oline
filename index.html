<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jogo Mundo Aberto - Protótipo GTA</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* Controles Mobile (Analógico Visual) */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: none;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }
        #jump-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            display: none;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
    <!-- Library Three.js para renderização 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <b>Controles PC:</b> Setas (Mover), Espaço (Pular), Tecle Espaço repetidamente + Seta Cima (Correr)<br>
        <b>Status:</b> Cidadão em Teste | Policial: Não
    </div>

    <div id="canvas-container"></div>

    <!-- Controles Mobile -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="jump-btn">PULAR</div>

    <script>
        // --- 1. CONFIGURAÇÃO DA CENA 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Céu azul

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Luzes
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // --- 2. MAPA E ELEMENTOS BÁSICOS ---
        // Chão principal (Representando o mapa)
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Quartel da Polícia (Construção simples no mapa)
        const policeGeo = new THREE.BoxGeometry(20, 10, 30);
        const policeMat = new THREE.MeshLambertMaterial({ color: 0x1e3d59 });
        const policeStation = new THREE.Mesh(policeGeo, policeMat);
        policeStation.position.set(40, 5, -40);
        scene.add(policeStation);

        // --- 3. JOGADOR (BONECO) ---
        const playerGroup = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.8);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
        const playerBody = new THREE.Mesh(bodyGeo, bodyMat);
        playerBody.position.y = 0.9;
        playerGroup.add(playerBody);
        scene.add(playerGroup);

        // Variáveis de Física do Jogador
        let playerPos = { x: 0, y: 0, z: 0 };
        let playerVelocityY = 0;
        let isGrounded = true;
        let moveSpeed = 0.15;
        const jumpForce = 0.25;
        const gravity = 0.01;

        // Mecânica de Corrida Rápida (Espaço repetido)
        let spaceTapCount = 0;
        let lastSpaceTap = 0;
        let isSprinting = false;

        // --- 4. CONTROLES (PC) ---
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            // Lógica de clicar várias vezes no Espaço para correr rápido
            if (e.code === 'Space') {
                const now = Date.now();
                if (now - lastSpaceTap < 300) {
                    spaceTapCount++;
                    if (spaceTapCount >= 2) {
                        isSprinting = true;
                    }
                } else {
                    spaceTapCount = 1;
                }
                lastSpaceTap = now;

                // Pulo
                if (isGrounded) {
                    playerVelocityY = jumpForce;
                    isGrounded = false;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
            if (e.code === 'Space') {
                setTimeout(() => { isSprinting = false; }, 500);
            }
        });

        // Detectar Mobile
        const isMobile = /Android|iPhone/i.test(navigator.userAgent);
        if (isMobile) {
            document.getElementById('joystick-zone').style.display = 'block';
            document.getElementById('jump-btn').style.display = 'flex';
        }

        // --- 5. LOOP DE ATUALIZAÇÃO DO JOGO ---
        function update() {
            // Velocidade base ou corrida
            let currentSpeed = isSprinting ? moveSpeed * 2.5 : moveSpeed;

            // Movimento PC (Setas)
            if (keys['ArrowUp']) playerGroup.position.z -= currentSpeed;
            if (keys['ArrowDown']) playerGroup.position.z += currentSpeed;
            if (keys['ArrowLeft']) playerGroup.position.x -= currentSpeed;
            if (keys['ArrowRight']) playerGroup.position.x += currentSpeed;

            // Gravidade e Pulo
            playerGroup.position.y += playerVelocityY;
            if (!isGrounded) {
                playerVelocityY -= gravity;
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    playerVelocityY = 0;
                    isGrounded = true;
                }
            }

            // Câmera seguindo o jogador (Terceira pessoa)
            camera.position.set(playerGroup.position.x, playerGroup.position.y + 4, playerGroup.position.z + 8);
            camera.lookAt(playerGroup.position);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        animate();

        // Ajuste de Tela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
